[package]
name = "rotex-gl"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "WebGL2 and GLES 3.0 backend for Rotex"
documentation = "https://docs.rs/rotex-gl"
repository = "https://github.com/rotex-labs/rotex-gl"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
async-trait = "0.1.89"
glow = "0.17.0"
libloading = "0.8.9"
rotex-core = { version = "0.3.0", git = "https://github.com/rotex-labs/rotex-core", rev = "23ba8931416ce7b604d91604bf421c3b514271d8" }
rotex-types = { version = "0.3.0", git = "https://github.com/rotex-labs/rotex-core", rev = "23ba8931416ce7b604d91604bf421c3b514271d8" }

[dev-dependencies]
pollster = "0.4.0"
rotex-conformance = { version = "0.3.0", git = "https://github.com/rotex-labs/rotex-core", rev = "23ba8931416ce7b604d91604bf421c3b514271d8" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "Window",
] }
